<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1512" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Tennis Training — Ivan</title>
<style>
:root{
  --bg:#0e1512;
  --bg2:#14201b;
  --card:#182924;
  --card2:#1e332c;
  --line:#26433a;
  --ink:#eaf5ef;
  --muted:#8fa89d;
  --accent:#38e08b;
  --accent2:#1f6f43;
  --tennis:#38e08b;
  --gym:#f5b74a;
  --run:#4aa8f5;
  --mob:#b98cf5;
  --match:#f56a6a;
  --danger:#ff6b6b;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;color-scheme:dark}
input[type=range]{accent-color:var(--accent);height:28px}
input[type=date],input[type=number]{color-scheme:dark}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--accent)}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#12201a 0%, rgba(14,21,18,.96) 100%);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:18px;margin:0;letter-spacing:.3px}
.top .sub{font-size:12px;color:var(--muted);margin-top:3px}
.pill{
  background:var(--card2);border:1px solid var(--line);color:var(--accent);
  border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap
}

main{padding:16px 14px 24px;max-width:720px;margin:0 auto}
.view{display:none}
.view.active{display:block}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px}
.card h3{font-size:15px;margin:0 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}

/* ---------- hero / week progress ---------- */
.hero{
  background:linear-gradient(150deg,#1c3a2b 0%, #16261f 60%);
  border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;
}
.hero .phase{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero .wk{font-size:26px;font-weight:700;margin:4px 0 2px}
.hero .theme{font-size:13px;color:var(--muted)}
.ringwrap{display:flex;align-items:center;gap:18px;margin-top:14px}
.ring{position:relative;width:96px;height:96px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:22px;line-height:1}
.ring .val span{font-size:10px;color:var(--muted);letter-spacing:.5px}
.heromini{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:rgba(0,0,0,.22);border-radius:12px;padding:9px 10px}
.mini .n{font-size:17px;font-weight:700}
.mini .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

/* ---------- stat grid ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat .n{font-size:19px;font-weight:700}
.stat .n small{font-size:11px;font-weight:600;color:var(--muted)}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}

/* ---------- chart ---------- */
.chart{width:100%;height:150px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ---------- bars ---------- */
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* ---------- day / session items ---------- */
.day{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.day.rest{opacity:.72}
.day-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.day-head .d{font-size:14px;font-weight:700;flex:1}
.day-head .meta{font-size:11px;color:var(--muted)}
.chev{color:var(--muted);font-size:12px;transition:transform .18s}
.day.open .chev{transform:rotate(90deg)}
.day-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.day.open .day-body{display:block}
.blockitem{padding:11px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.blockitem:last-child{border-bottom:none}
.blockitem .bt{display:flex;gap:8px;align-items:baseline}
.blockitem .bt b{font-size:14px}
.blockitem ul{margin:6px 0 0;padding-left:17px}
.blockitem li{font-size:13px;line-height:1.5;color:#cfe0d7;margin-bottom:3px}
.tag{font-size:10px;padding:3px 8px;border-radius:999px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.t-tennis{background:rgba(56,224,139,.15);color:var(--tennis)}
.t-gym{background:rgba(245,183,74,.15);color:var(--gym)}
.t-run{background:rgba(74,168,245,.15);color:var(--run)}
.t-mobility{background:rgba(185,140,245,.15);color:var(--mob)}
.t-match{background:rgba(245,106,106,.15);color:var(--match)}
.t-rust{background:rgba(255,255,255,.08);color:var(--muted)}

.sess{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:var(--card)}
.sess .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.sess .body{flex:1;min-width:0}
.sess .ttl{font-size:14px;font-weight:600}
.sess .sub{font-size:12px;color:var(--muted);margin-top:2px}
.sess .note{font-size:12.5px;color:#cfe0d7;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.rpe{font-size:11px;font-weight:700;padding:3px 7px;border-radius:8px;background:rgba(255,255,255,.07);color:var(--muted)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--accent);color:#082114;border:none;border-radius:12px;
  padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;
}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;border:1px solid rgba(255,107,107,.5);color:var(--danger)}
.btn.block{width:100%}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

.fab{
  position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:45;
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#082114;
  border:none;font-size:28px;font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.45);cursor:pointer
}

/* ---------- nav ---------- */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(18,32,26,.97);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  backdrop-filter:blur(10px);
}
nav.bottom button{
  background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;cursor:pointer
}
nav.bottom button .i{font-size:19px;line-height:1}
nav.bottom button.active{color:var(--accent)}

/* ---------- forms ---------- */
label.f{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;color:var(--ink);outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical;line-height:1.5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  flex:1 1 auto;min-width:64px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);
  border-radius:11px;padding:10px 8px;font-size:12.5px;font-weight:600;cursor:pointer
}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#082114}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.timegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.timecell{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:6px 8px}
.timecell span{font-size:12px;font-weight:700;color:var(--muted);width:22px;flex:0 0 auto}
.timecell input{border:none;background:transparent;padding:4px 0;font-size:15px}
.timecell input:focus{border:none}
.btn.block{width:100%}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.modal .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:var(--bg2);border-top-left-radius:22px;border-top-right-radius:22px;
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
}
.grab{width:40px;height:4px;border-radius:99px;background:#3a5a4d;margin:8px auto 4px}
.sheet h2{font-size:17px;margin:6px 0 2px}

/* ---------- gym rows ---------- */
.exrow{display:grid;grid-template-columns:1fr 46px 46px 56px 30px;gap:6px;margin-bottom:7px;align-items:center}
.exrow input{padding:9px 8px;font-size:14px;border-radius:9px}
.exrow .del{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:0}
.exhead{display:grid;grid-template-columns:1fr 46px 46px 56px 30px;gap:6px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}

.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav button{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:11px;width:42px;height:42px;font-size:17px;cursor:pointer}
.weeknav .info{flex:1;text-align:center}
.weeknav .info b{display:block;font-size:15px}
.weeknav .info span{font-size:11px;color:var(--muted)}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 10px;line-height:1.6}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg2);display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;cursor:pointer;flex:0 0 auto}
.check.on{background:var(--accent);border-color:var(--accent);color:#082114}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--accent);color:#082114;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.show{opacity:1}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div>
      <h1 id="topTitle">Dashboard</h1>
      <div class="sub" id="topSub">—</div>
    </div>
    <div class="pill" id="topPill">Week 1</div>
  </div>
</header>

<main>
  <section id="view-dash" class="view active"></section>
  <section id="view-schema" class="view"></section>
  <section id="view-log" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>

<button class="fab" id="fab" aria-label="Sessie toevoegen">+</button>

<nav class="bottom">
  <button data-view="dash" class="active"><span class="i">📊</span>Dashboard</button>
  <button data-view="schema"><span class="i">📅</span>Schema</button>
  <button data-view="log"><span class="i">📝</span>Logboek</button>
  <button data-view="settings"><span class="i">⚙️</span>Instellingen</button>
</nav>

<div class="modal" id="modal">
  <div class="backdrop" data-close></div>
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   TENNIS TRAINING APP — single file, data in localStorage
   ============================================================ */

/* ---------- 1. OPSLAG ---------- */
const KEY = 'ivan-tennis-app-v1';
const DEFAULT_CAL_TIMES = ['18:00','07:00','18:00','18:00','18:00','10:00','10:00'];
const DEFAULTS = { settings:{ startDate:null, weeklyGoal:5, calTimes:null, calReminder:60, calWeeks:12, calRest:false }, sessions:[] };
let DB = loadDB();

function loadDB(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return seed();
    const d = JSON.parse(raw);
    d.settings = Object.assign({}, DEFAULTS.settings, d.settings||{});
    d.sessions = d.sessions||[];
    if(!d.settings.startDate) d.settings.startDate = iso(mondayOf(new Date()));
    return d;
  }catch(e){ return seed(); }
}
function seed(){
  const d = JSON.parse(JSON.stringify(DEFAULTS));
  d.settings.startDate = iso(mondayOf(new Date()));
  return d;
}
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }

/* ---------- 2. DATUM HELPERS ---------- */
const DAYNAMES = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
const DAYSHORT = ['Ma','Di','Wo','Do','Vr','Za','Zo'];
const MONTHS = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];

function pad(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function mondayOf(d){ const x=new Date(d); const off=(x.getDay()+6)%7; x.setDate(x.getDate()-off); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((mondayOf(b)-mondayOf(a))/86400000); }
function fmtDate(s){ const d=parseISO(s); return DAYSHORT[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()]; }
function todayISO(){ return iso(new Date()); }

/* plan-weeknummer (1..12, daarna nieuwe ronde) op basis van startdatum */
function absWeek(dateStr){
  const diff = Math.floor((mondayOf(parseISO(dateStr)) - mondayOf(parseISO(DB.settings.startDate)))/86400000);
  return Math.floor(diff/7)+1;
}
function planWeek(dateStr){
  let w = absWeek(dateStr);
  if(w<1) return 1;
  return ((w-1)%12)+1;
}
function roundNr(dateStr){ const w=absWeek(dateStr); return w<1?1:Math.floor((w-1)/12)+1; }

/* ---------- 3. TRAININGSSCHEMA (12 weken, 5 dagen p/w) ---------- */
const PHASES = [
  {name:'Fundament',   weeks:[1,2,3,4],   doel:'Belastbaarheid, techniek herstellen, aerobe basis'},
  {name:'Ontwikkeling',weeks:[5,6,7,8],   doel:'Meer intensiteit, kracht opbouwen, patronen inslijpen'},
  {name:'Intensivering',weeks:[9,10,11,12],doel:'Explosiviteit, wedstrijdvormen, alles samenvoegen'}
];
const DELOADS = [4,8,12];

const WEEKDATA = [
  { theme:'Consistentie & baanpositie', note:'Rustig starten. Doel is ritme, geen power. 10 ballen op rij is beter dan 1 winner.',
    a:['Crosscourt forehand 4×6\' — doel 10+ ballen op rij, 1,5 m boven het net','Crosscourt backhand 4×6\' — zelfde doel','Rally op halve kracht (70%) 2×8\' — herstelpositie na elke bal','Service: 40 ballen, alleen ritme en toss'],
    b:['Longline forehand 3×6\' + longline backhand 3×6\'','Kruispatroon: 2 cross, 1 longline (afwisselend) 3×6\'','Diepteoefening: alle ballen achter de servicelijn, 2×8\'','Return: 30 returns diep in het midden'],
    m:['20\' inspelen + service','2 sets tot 4 games (of 40 min vrij spelen) op 80% intensiteit','Focus: elke bal terug + herstelpositie','Na afloop: 10 min uitlopen'],
    r1:'35 min rustige duurloop, Zone 2 (je kunt praten)', r2:'Voetenwerk: 6×20 m zijwaarts + 6× spider drill, 8×60 m opbouwsprint (60% herstel)'},
  { theme:'Diepte & lengte', note:'Alles achter de servicelijn. Diepte is jouw wapen om de basis te leggen.',
    a:['Crosscourt met dieptezone (achterste 3 m) 4×6\'','Backhand crosscourt idem 3×6\'','Rally 2×10\': elke bal die kort valt = min 1 punt','Service: 3×10 eerste opslagen wide + 3×10 T'],
    b:['Neutraal-naar-aanval: 3 diepe ballen, dan aanval 3×6\'','Backhand richting wisselen op signaal 3×6\'','Approach + eerste volley 2×6\'','Return: 20 returns cross, 20 returns diep midden'],
    m:['Inspelen 20\'','Tiebreaks: 3× tot 7 punten, dan 2 sets tot 4 games','Focus: gemiddelde ballengte hoog houden','Uitlopen + stretch 10\''],
    r1:'40 min rustige duurloop Zone 2', r2:'Voetenwerk: 3×(4 hoeken shuttle) + 10×30 m sprints, volledig herstel'},
  { theme:'Service & return', note:'Twee gratis punten per game beginnen hier. Veel herhaling, weinig intensiteit.',
    a:['Service-blok 1: 60 ballen — 20 wide, 20 T, 20 body (eerste opslag)','Service-blok 2: 40 tweede opslagen met spin, kick over de servicelijn','Service + 1: 3×10 punten waarin je na de service direct aanvalt','Rally afsluiten 2×8\''],
    b:['Return-blok: 40 returns tegen eerste opslag (blok, kort), 40 tegen tweede (stap in)','Return + 1: 3×10 punten, jij begint met de return','Crosscourt rally 3×6\' op tempo','Volley-ladder 2×5\''],
    m:['Inspelen 20\'','Servicegames spelen: 6 games alleen jouw service, dan 6 games return','2 sets tot 4 games','Uitlopen'],
    r1:'40 min duurloop Zone 2 + 4×20 sec versnelling aan het eind', r2:'Voetenwerk: split-step reactie 3×8, 12×20 m sprints uit split-step'},
  { theme:'DELOAD — herstel & techniek', note:'Rustige week. Alles op ~65%. Lichaam laten aanpassen zodat je week 5 fris start.',
    a:['Rustig inspelen 15\'','Crosscourt rally op 60% 3×6\' — puur techniek en timing','Service: 30 ballen, alleen gevoel','Uitrollen/stretchen 10\''],
    b:['Rally rustig 3×6\'','Slice, dropshot, lob: 15 min speelvormen','Volley + smash rustig 10\'','Losse punten zonder score 15\''],
    m:['Vrij spelen 60-75 min zonder score, veel variatie','Focus: plezier en gevoel'],
    r1:'25 min heel rustig lopen of fietsen', r2:'Mobiliteit 30 min: heupen, enkels, thoracaal + rustige core'},
  { theme:'Aanvallen vanaf de baseline', note:'Fase 2 start: je gaat kortere ballen straffen en het initiatief nemen.',
    a:['Feed korte bal → inside-out forehand 4×8 ballen ×3','Aanvalspatroon: cross-cross-longline winner 3×6\'','Live rally waarbij korte bal = verplicht aanvallen 3×6\'','Service + forehand 2×10 punten'],
    b:['Backhand langs de lijn onder druk 3×6\'','Van verdediging naar aanval: 1 hoge slice, dan aanvallen 3×6\'','Approach shot + volley afmaken 3×6\'','Return + aanval 2×10 punten'],
    m:['Inspelen 20\'','3 sets tot 4 games, opdracht: min. 1 aanval per game','Score los bijhouden: hoeveel aanvallen won je?','Uitlopen'],
    r1:'45 min duurloop Zone 2', r2:'Intervallen: 8×400 m op 5 km-tempo, 90 sec pauze + voetenwerkladder'},
  { theme:'Verdediging & herstel in de rally', note:'Punten winnen die je "verloren" was. Hoog, diep, tijd kopen.',
    a:['Hoge diepe verdediging: coach speelt hoeken, jij overleeft 6×90 sec','Slice backhand diep 3×6\'','Van verdediging naar neutraal 3×8\'','Service 40 ballen'],
    b:['Twee-tegen-één (of coach in de hoeken) 4×5\'','Lob + smash spel 15\'','Rally lang: 3×10\' zonder fout, minimaal 12 slagen','Return tegen zware service 30 ballen'],
    m:['Inspelen 20\'','2 sets tot 6 games (met tiebreak)','Focus: 0 onnodige fouten in de eerste 4 slagen','Uitlopen'],
    r1:'45 min duurloop Zone 2 + heuvel/tempo-stuk 10 min', r2:'Intervallen: 6×(45 sec hard / 75 sec rust) + 6 baanshuttles'},

function phaseOf(w){
  const p = PHASES.find(p=>p.weeks.includes(w));
  return p||PHASES[0];
}
function isDeload(w){ return DELOADS.includes(w); }
function gymLevel(w){ if(isDeload(w)) return 0; if(w<=3) return 1; if(w<=7) return 2; return 3; }

/* bouwt het volledige weekplan */
function buildWeek(w){
  const d = WEEKDATA[w-1];
  const dl = isDeload(w);
  const gl = gymLevel(w);
  const ga = GYM_A[gl], gb = GYM_B[gl];
  const tennisDur = dl?60:90, matchDur = dl?70:120, gymDur = dl?35:55;
  const days = [
    { name:'Maandag', blocks:[
      {type:'tennis', title:'Tennis — techniek', dur:tennisDur, items:['10\' inspelen + voetenwerk'].concat(d.a)},
      {type:'gym', title:ga.label, dur:gymDur, ex:ga.ex,
       items:ga.ex.map(e=>e.n+' — '+e.s+'×'+e.r).concat([dl?'Rustig tempo, RPE 5':'Laatste set zwaar maar technisch schoon'])}
    ]},
    { name:'Dinsdag', blocks:[
      {type:'run', title:'Duurloop + core', dur:dl?30:50, items:[d.r1,'Core: 3× (plank 45\'\' / side plank 30\'\' p/z / dead bug 10 p/z)','Na afloop 5 min stretchen']}
    ]},
    { name:'Woensdag', rest:true, blocks:[
      {type:'mobility', title:'Herstel (optioneel)', dur:20, items:['20 min mobiliteit: heupen, enkels, thoracale wervelkolom','Foam rollen quadriceps, kuiten, bilspieren','Of: 20-30 min wandelen']}
    ]},
    { name:'Donderdag', blocks:[
      {type:'tennis', title:'Tennis — techniek & tactiek', dur:tennisDur, items:['10\' inspelen'].concat(d.b)},
      {type:'gym', title:gb.label, dur:gymDur, ex:gb.ex,
       items:gb.ex.map(e=>e.n+' — '+e.s+'×'+e.r).concat([dl?'Licht houden':'Rustig zakken, explosief omhoog'])}
    ]},
    { name:'Vrijdag', blocks:[
      {type:'run', title:'Voetenwerk & intervallen', dur:dl?30:45, items:['10\' inlopen + dynamisch warm maken',d.r2,'5\' uitlopen + stretch']}
    ]},
    { name:'Zaterdag', blocks:[
      {type:'match', title:'Matchplay', dur:matchDur, items:d.m}
    ]},
    { name:'Zondag', rest:true, blocks:[
      {type:'mobility', title:'Rustdag', dur:15, items:['Volledig vrij','Eventueel 15 min stretchen of een wandeling','Sessie loggen mag, hoeft niet']}
    ]}
  ];
  return { n:w, phase:phaseOf(w), deload:dl, theme:d.theme, note:d.note, days:days };
}

/* ---------- 5. BEREKENINGEN ---------- */
function sessionsSorted(){ return DB.sessions.slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.created||0)-(a.created||0)); }
function weekRange(monday){ const s=iso(monday), e=iso(addDays(monday,6)); return [s,e]; }
function sessionsInWeek(monday){ const [s,e]=weekRange(monday); return DB.sessions.filter(x=>x.date>=s&&x.date<=e); }
function sumMin(list){ return list.reduce((t,x)=>t+(+x.minutes||0),0); }
function sumKm(list){ return list.reduce((t,x)=>t+(+x.km||0),0); }
function avg(list, f){ const v=list.map(f).filter(x=>x>0); return v.length? v.reduce((a,b)=>a+b,0)/v.length : 0; }
function trainingDays(list){ return new Set(list.map(x=>x.date)).size; }
function fmtMin(m){ m=Math.round(m); if(m<60) return m+' min'; const h=Math.floor(m/60), r=m%60; return h+'u'+(r?' '+r:''); }
function minToTime(m){ m=((Math.round(m)%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); }
function fmtHours(m){ return (m/60).toFixed(1).replace('.',',')+'u'; }
function pace(km,min){ if(!km||!min) return null; const p=min/km; const mm=Math.floor(p), ss=Math.round((p-mm)*60); return mm+':'+pad(ss==60?0:ss)+' /km'; }
function tonnage(s){ if(!s.ex) return 0; return s.ex.reduce((t,e)=> t + (+e.sets||0)*(+e.reps||0)*(+e.kg||0), 0); }

function weekStreak(){
  let streak=0; let m = mondayOf(new Date());
  for(let i=0;i<200;i++){
    const list = sessionsInWeek(m);
    const days = trainingDays(list);
    if(i===0 && days===0){ m=addDays(m,-7); continue; } // huidige week telt nog niet mee als leeg
    if(days>=4){ streak++; m=addDays(m,-7); } else break;
  }
  return streak;
}
function dayStreak(){
  let streak=0; let d=new Date(); d.setHours(0,0,0,0);
  const set = new Set(DB.sessions.map(s=>s.date));
  if(!set.has(iso(d))) d = addDays(d,-1);
  while(set.has(iso(d))){ streak++; d=addDays(d,-1); }
  return streak;
}
function plannedDaysCount(w){ return buildWeek(w).days.filter(d=>!d.rest).length; }

const HEX = {tennis:'#38e08b', match:'#f56a6a', gym:'#f5b74a', run:'#4aa8f5', mobility:'#b98cf5'};

/* ---------- 6. DASHBOARD ---------- */
function chartWeeks(n){
  const out=[]; const m = mondayOf(new Date());
  for(let i=n-1;i>=0;i--){
    const mm = addDays(m,-7*i);
    const list = sessionsInWeek(mm);
    const per={}; Object.keys(TYPES).forEach(t=> per[t]=sumMin(list.filter(s=>s.type===t)));
    out.push({monday:mm, per:per, total:sumMin(list)});
  }
  return out;
}
function svgChart(data){
  const W=340,H=150,pad=18,bw=(W-pad*2)/data.length;
  const max=Math.max(60,...data.map(d=>d.total));
  let bars='',labels='',grid='';
  [0.5,1].forEach(f=>{
    const y=H-24-(H-44)*f;
    grid+='<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+y+'" y2="'+y+'" stroke="rgba(255,255,255,.07)" stroke-width="1"/>';
  });
  data.forEach((d,i)=>{
    const x=pad+i*bw+bw*0.18, bwid=bw*0.64;
    let y=H-24;
    Object.keys(TYPES).forEach(t=>{
      const mins=d.per[t]; if(!mins) return;
      const h=(H-44)*(mins/max);
      y-=h;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bwid.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+HEX[t]+'" rx="2"/>';
    });
    if(d.total===0){
      bars+='<rect x="'+x.toFixed(1)+'" y="'+(H-27)+'" width="'+bwid.toFixed(1)+'" height="3" fill="rgba(255,255,255,.12)" rx="1.5"/>';
    }
    const lbl = (d.monday.getDate())+'/'+(d.monday.getMonth()+1);
    labels+='<text x="'+(pad+i*bw+bw/2).toFixed(1)+'" y="'+(H-8)+'" fill="#8fa89d" font-size="9" text-anchor="middle">'+lbl+'</text>';
    if(d.total) labels+='<text x="'+(pad+i*bw+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" fill="#8fa89d" font-size="8.5" text-anchor="middle">'+Math.round(d.total/60*10)/10+'u</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+grid+bars+labels+'</svg>';
}
function ring(pct,center,sub){
  const r=42,c=2*Math.PI*r,off=c*(1-Math.min(1,pct));
  return '<div class="ring"><svg width="96" height="96">'+
    '<circle cx="48" cy="48" r="'+r+'" stroke="rgba(255,255,255,.09)" stroke-width="9" fill="none"/>'+
    '<circle cx="48" cy="48" r="'+r+'" stroke="#38e08b" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
    '</svg><div class="val"><b>'+center+'</b><span>'+sub+'</span></div></div>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function prefillFromPlan(dateStr, bi){
  const w = planWeek(dateStr);
  const plan = buildWeek(w);
  const di = (parseISO(dateStr).getDay()+6)%7;
  const b = plan.days[di].blocks[bi];
  return {
    id:null, date:dateStr, type:b.type, title:b.title, minutes:b.dur,
    planKey:dateStr+'#'+bi, rpe:'', feel:0, notes:'', km:'',
    ex: b.ex? b.ex.map(e=>({name:e.n, sets:e.s, reps:e.r, kg:''})) : []
  };
}

/* ---------- 8. AGENDA / ICS EXPORT ---------- */
function calTimes(){
  const t = DB.settings.calTimes;
  return (Array.isArray(t) && t.length===7) ? t.slice() : DEFAULT_CAL_TIMES.slice();
}
function icsEsc(s){
  return String(s==null?'':s)
    .replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,')
    .replace(/\r?\n/g,'\\n');
}
function fold(line){
  let out='', chunk='', cur=0;
  for(const ch of line){
    const len = new TextEncoder().encode(ch).length;
    if(cur+len > 73){ out += chunk + '\r\n '; chunk=''; cur=1; }
    chunk += ch; cur += len;
  }
  return out + chunk;
}
function utcStamp(d){
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
}
function localStamp(dateStr, mins){
  const d = parseISO(dateStr);
  d.setMinutes(d.getMinutes()+mins);
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
}
const VTIMEZONE = [
'BEGIN:VTIMEZONE','TZID:Europe/Amsterdam','X-LIC-LOCATION:Europe/Amsterdam',
'BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST',
'DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT',
'BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET',
'DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD',
'END:VTIMEZONE'];

/* alle trainingsblokken van één datum, met begintijd in minuten na middernacht */
function calEventsForDate(dateStr){
  const w = planWeek(dateStr);
  const plan = buildWeek(w);
  const di = (parseISO(dateStr).getDay()+6)%7;
  const day = plan.days[di];
  const t = calTimes()[di].split(':');
  let cursor = (+t[0])*60 + (+t[1]);
  return day.blocks.map((b,bi)=>{
    const ev = { date:dateStr, bi:bi, block:b, start:cursor, week:w, plan:plan, rest:!!day.rest, dayName:day.name };
    cursor += b.dur + 15;
    return ev;
  });
}
function veventFor(ev){
  const b = ev.block;
  const rem = +DB.settings.calReminder||0;
  const desc = 'Week '+ev.week+' van 12 — '+ev.plan.phase.name+(ev.plan.deload?' (deload)':'')+'\n'+
               ev.plan.theme+'\n\n'+
               b.items.map(i=>'• '+i).join('\n')+'\n\n'+
               'Afvinken en loggen in je trainingsapp.';
  const lines = [
    'BEGIN:VEVENT',
    'UID:tt-'+ev.date+'-'+ev.bi+'@ivan-tennis',
    'DTSTAMP:'+utcStamp(new Date()),
    'SEQUENCE:'+Math.floor((Date.now()-1577836800000)/60000),
    'DTSTART;TZID=Europe/Amsterdam:'+localStamp(ev.date, ev.start),
    'DTEND;TZID=Europe/Amsterdam:'+localStamp(ev.date, ev.start + b.dur),
    'SUMMARY:'+icsEsc(TYPES[b.type].icon+' '+b.title),
    'DESCRIPTION:'+icsEsc(desc),
    'CATEGORIES:'+icsEsc('Tennis training,'+TYPES[b.type].label),
    'STATUS:CONFIRMED',
    'TRANSP:OPAQUE'
  ];
  if(rem>0){
    lines.push('BEGIN:VALARM','TRIGGER:-PT'+rem+'M','ACTION:DISPLAY',
               'DESCRIPTION:'+icsEsc(b.title),'END:VALARM');
  }
  lines.push('END:VEVENT');
  return lines;
}
function buildICS(events, name){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ivan Tennis Training//NL','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:'+icsEsc(name||'Tennis training'),'X-WR-TIMEZONE:Europe/Amsterdam']
    .concat(VTIMEZONE);
  events.forEach(ev=> lines.push.apply(lines, veventFor(ev)));
  lines.push('END:VCALENDAR');
  return lines.map(fold).join('\r\n')+'\r\n';
}
/* alle events vanaf aanstaande maandag (of vandaag) voor n weken */
function calEventsRange(weeks){
  const start = new Date(); start.setHours(0,0,0,0);
  const evs = [];
  for(let i=0;i<weeks*7;i++){
    const ds = iso(addDays(start,i));
    calEventsForDate(ds).forEach(ev=>{
      if(ev.rest && !DB.settings.calRest) return;
      evs.push(ev);
    });
  }
  return evs;
}
function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
  return true;
}
function downloadICS(text, filename){
  try{
    const blob = new Blob([text], {type:'text/calendar;charset=utf-8'});
    /* iPhone/iPad: via het deelmenu kun je direct "Agenda" kiezen */
    if(typeof File === 'function' && navigator.canShare){
      const file = new File([blob], filename, {type:'text/calendar'});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'Tennis training'})
          .catch(()=>{ saveBlob(blob, filename); });
        return true;
      }
    }
    return saveBlob(blob, filename);
  }catch(e){ return false; }
}
function openICS(text){
  window.location.href = 'data:text/calendar;charset=utf-8,'+encodeURIComponent(text);
}
function exportSchedule(){
  const weeks = +DB.settings.calWeeks||12;
  const evs = calEventsRange(weeks);
  if(!evs.length){ toast('Geen trainingen gevonden'); return; }
  const ics = buildICS(evs, 'Tennis training — Ivan');
  downloadICS(ics, 'tennis-schema-'+weeks+'weken.ics');
  toast(evs.length+' afspraken geëxporteerd');
}
function exportDay(dateStr){
  const evs = calEventsForDate(dateStr);
  if(!evs.length){ toast('Niets te plannen'); return; }
  const ics = buildICS(evs, 'Tennis training');
  downloadICS(ics, 'training-'+dateStr+'.ics');
  toast('Dag geëxporteerd');
}

    DB.settings.calTimes = Array.from(document.querySelectorAll('.calTime'))
      .sort((a,b)=>a.dataset.day-b.dataset.day)
      .map(i=> i.value || DEFAULT_CAL_TIMES[+i.dataset.day]);
    DB.settings.calReminder = +document.getElementById('calRem').value;
    DB.settings.calWeeks = +document.getElementById('calWeeks').value;
    save();
  }
  document.querySelectorAll('.calTime').forEach(i=> i.onchange=()=>{ saveCal(); updIcsInfo(); renderPlanViews(); });
  document.getElementById('calRem').onchange=saveCal;
  document.getElementById('calWeeks').onchange=()=>{ saveCal(); updIcsInfo(); };
  document.querySelectorAll('#calRestSeg [data-rest]').forEach(b=>{
    b.onclick=()=>{
      DB.settings.calRest = b.dataset.rest==='1';
      save();
      document.querySelectorAll('#calRestSeg [data-rest]').forEach(x=>x.classList.toggle('on', x===b));
      updIcsInfo();
    };
  });
  function updIcsInfo(){
    const n = calEventsRange(+DB.settings.calWeeks||12).length;
    document.getElementById('icsInfo').innerHTML = 'Dit maakt <b>'+n+'</b> afspraken aan.';
  }
  document.getElementById('icsBtn').onclick=()=>{ saveCal(); exportSchedule(); };
  document.getElementById('icsOpen').onclick=()=>{
    saveCal();
    openICS(buildICS(calEventsRange(+DB.settings.calWeeks||12), 'Tennis training — Ivan'));
  };

  document.getElementById('expBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='tennis-training-backup-'+todayISO()+'.json';
    a.click(); URL.revokeObjectURL(a.href);
  };
  document.getElementById('impBtn').onclick=()=>document.getElementById('fileIn').click();
  document.getElementById('fileIn').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.sessions) throw new Error('geen sessies');
        DB.sessions = d.sessions;
        DB.settings = Object.assign(DB.settings, d.settings||{});
        save(); toast('Import gelukt'); render();
      }catch(err){ alert('Kon dit bestand niet lezen.'); }
    };
    r.readAsText(f);
  };
  document.getElementById('wipeBtn').onclick=()=>{
    if(confirm('Alle sessies verwijderen? Dit kan niet ongedaan worden gemaakt.')){
      DB.sessions=[]; save(); toast('Alles gewist'); render();
    }
  };
}


/* ---------- 11. SESSIE-FORMULIER ---------- */
let form = null;
function openSession(s){
  form = Object.assign({id:null,date:todayISO(),type:'tennis',title:'',minutes:'',km:'',rpe:6,feel:0,notes:'',ex:[],planKey:null}, s||{});
  form.ex = (form.ex||[]).map(e=>Object.assign({},e));
  renderSheet();
  document.getElementById('modal').classList.add('open');
}
function closeSheet(){ document.getElementById('modal').classList.remove('open'); form=null; }

function collectForm(){
  const g=id=>document.getElementById(id);
  if(!g('fDate')) return;
  form.date = g('fDate').value || todayISO();
  form.title = g('fTitle').value;
  form.minutes = g('fMin').value;
  form.rpe = g('fRpe') ? g('fRpe').value : form.rpe;
  form.notes = g('fNotes').value;
  if(g('fKm')) form.km = g('fKm').value;
  const rows = document.querySelectorAll('#exList .exrow');
  if(rows.length || form.type==='gym'){
    form.ex = Array.from(rows).map(r=>({
      name:r.querySelector('.exn').value,
      sets:r.querySelector('.exs').value,
      reps:r.querySelector('.exr').value,
      kg:r.querySelector('.exk').value
    })).filter(e=>e.name.trim());
  }
}

function renderSheet(){
  const f=form;
  const isRun = f.type==='run', isGym = f.type==='gym';
  const paceTxt = pace(+f.km, +f.minutes);
  const sheet=document.getElementById('sheet');
  sheet.innerHTML =
    '<div class="grab"></div>'+
    '<div class="row"><h2>'+(f.id?'Sessie bewerken':'Sessie loggen')+'</h2>'+
      '<button class="btn ghost small" data-close>Sluiten</button></div>'+
    (f.planKey?'<div class="tiny muted" style="margin-top:4px">Gekoppeld aan je schema ('+fmtDate(f.date)+')</div>':'')+

    '<label class="f">Type</label>'+
    '<div class="seg" id="typeSeg">'+Object.keys(TYPES).map(t=>'<button data-type="'+t+'" class="'+(f.type===t?'on':'')+'">'+TYPES[t].icon+' '+TYPES[t].label+'</button>').join('')+'</div>'+

    '<div class="inline"><div><label class="f">Datum</label><input type="date" id="fDate" value="'+f.date+'"></div>'+
    '<div><label class="f">'+(isRun?'Tijd (min)':'Duur (min)')+'</label><input type="number" inputmode="numeric" id="fMin" value="'+(f.minutes||'')+'" placeholder="60"></div></div>'+

    (isRun? '<div class="inline"><div><label class="f">Afstand (km)</label><input type="number" step="0.1" inputmode="decimal" id="fKm" value="'+(f.km||'')+'" placeholder="8.0"></div>'+
      '<div><label class="f">Tempo</label><input type="text" id="fPace" value="'+(paceTxt||'—')+'" disabled></div></div>' : '')+

    '<label class="f">Titel</label>'+
    '<input type="text" id="fTitle" value="'+esc(f.title)+'" placeholder="'+TYPES[f.type].label+'">'+

    (isGym?
      '<label class="f">Oefeningen</label>'+
      '<div class="exhead"><span>Oefening</span><span>Set</span><span>Rep</span><span>Kg</span><span></span></div>'+
      '<div id="exList">'+ f.ex.map(exRow).join('') +'</div>'+
      '<div class="btnrow" style="margin-top:8px">'+
        '<button class="btn ghost small" id="addEx">+ Oefening</button>'+
        '<button class="btn ghost small" data-fill="A">Kracht A uit schema</button>'+
        '<button class="btn ghost small" data-fill="B">Kracht B uit schema</button>'+
      '</div>'
    : '')+

    '<label class="f" id="rpeLbl">Zwaarte (RPE '+f.rpe+'/10)</label>'+
    '<input type="range" min="1" max="10" step="1" id="fRpe" value="'+f.rpe+'" style="width:100%">'+

    '<label class="f">Hoe voelde het?</label>'+
    '<div class="seg" id="feelSeg">'+FEELS.map((e,i)=>'<button data-feel="'+(i+1)+'" class="'+(+f.feel===i+1?'on':'')+'" style="font-size:19px">'+e+'</button>').join('')+'</div>'+

    '<label class="f">Notities</label>'+
    '<textarea id="fNotes" placeholder="Wat ging goed, wat wil je onthouden? Bijv: forehand cross voelde stabiel, tweede opslag te kort.">'+esc(f.notes)+'</textarea>'+

    '<div style="margin-top:18px">'+
      '<button class="btn block" id="saveSess">Opslaan</button>'+
      (f.id?'<button class="btn danger block" id="delSess" style="margin-top:8px">Verwijderen</button>':'')+
    '</div>';

  sheet.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  sheet.querySelectorAll('#typeSeg [data-type]').forEach(b=>{
    b.onclick=()=>{
      collectForm();
      const oldDefault = TYPES[form.type].label;
      form.type=b.dataset.type;
      if(!form.title || form.title===oldDefault) form.title='';
      renderSheet();
    };
  });
  sheet.querySelectorAll('#feelSeg [data-feel]').forEach(b=>{
    b.onclick=()=>{ collectForm(); form.feel = (+form.feel===+b.dataset.feel)?0:+b.dataset.feel; renderSheet(); };
  });
  const rpe=document.getElementById('fRpe');
  if(rpe) rpe.oninput=()=>{ form.rpe=rpe.value; document.getElementById('rpeLbl').textContent='Zwaarte (RPE '+rpe.value+'/10)'; };
  const updPace=()=>{ collectForm(); const d=document.getElementById('fPace'); if(d) d.value = pace(+form.km,+form.minutes)||'—'; };
  const km=document.getElementById('fKm'); if(km) km.oninput=updPace;
  const mn=document.getElementById('fMin'); if(mn && km) mn.oninput=updPace;
  const ae=document.getElementById('addEx');
  if(ae) ae.onclick=()=>{ collectForm(); form.ex.push({name:'',sets:'',reps:'',kg:''}); renderSheet(); };
  sheet.querySelectorAll('[data-fill]').forEach(b=>{
    b.onclick=()=>{
      collectForm();
      const lvl = gymLevel(planWeek(form.date));
      const src = b.dataset.fill==='A'?GYM_A[lvl]:GYM_B[lvl];
      form.ex = src.ex.map(e=>({name:e.n,sets:e.s,reps:e.r,kg:''}));
      if(!form.title) form.title = src.label;
      renderSheet();
    };
  });
  sheet.querySelectorAll('.exrow .del').forEach((b,i)=>{
    b.onclick=()=>{ collectForm(); form.ex.splice(i,1); renderSheet(); };
  });
  document.getElementById('saveSess').onclick=saveSession;
  const del=document.getElementById('delSess');
  if(del) del.onclick=()=>{
    if(confirm('Deze sessie verwijderen?')){
      DB.sessions = DB.sessions.filter(x=>x.id!==form.id);
      save(); closeSheet(); render(); toast('Verwijderd');
    }
  };
}
function exRow(e){
  return '<div class="exrow">'+
    '<input class="exn" type="text" value="'+esc(e.name)+'" placeholder="Oefening">'+
    '<input class="exs" type="text" inputmode="numeric" value="'+esc(e.sets)+'" placeholder="3">'+
    '<input class="exr" type="text" value="'+esc(e.reps)+'" placeholder="10">'+
    '<input class="exk" type="text" inputmode="decimal" value="'+esc(e.kg)+'" placeholder="kg">'+
    '<button class="del">×</button></div>';
}
function saveSession(){
  collectForm();
  const s = {
    id: form.id || (Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
    created: form.created || Date.now(),
    date: form.date,
    type: form.type,
    title: (form.title||'').trim() || TYPES[form.type].label,
    minutes: +form.minutes||0,
    km: form.type==='run' ? (+form.km||0) : 0,
    rpe: +form.rpe||0,
    feel: +form.feel||0,
    notes: (form.notes||'').trim(),
    ex: form.type==='gym' ? (form.ex||[]).filter(e=>e.name && e.name.trim()) : [],
    planKey: form.planKey||null
  };
  const i = DB.sessions.findIndex(x=>x.id===s.id);
  if(i>=0) DB.sessions[i]=s; else DB.sessions.push(s);
  save(); closeSheet(); render(); toast(i>=0?'Bijgewerkt ✓':'Sessie opgeslagen ✓');
}

/* ---------- 12. APP ---------- */
let currentView='dash';
function setView(v){
  currentView=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  updateHeader();
  window.scrollTo(0,0);
}
function updateHeader(){
  const titles={dash:'Dashboard',schema:'Trainingsschema',log:'Logboek',settings:'Instellingen'};
  const w=planWeek(todayISO()), plan=buildWeek(w);
  document.getElementById('topTitle').textContent=titles[currentView];
  const d=new Date();
  const subs={
    dash: DAYNAMES[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()],
    schema: plan.phase.name+' — '+plan.phase.doel,
    log: DB.sessions.length+' sessies gelogd',
    settings: 'Data staat lokaal op dit toestel'
  };
  document.getElementById('topSub').textContent=subs[currentView];
  document.getElementById('topPill').textContent='Week '+w+(plan.deload?' · deload':'');
}
function render(){
  renderDash(); renderSchema(); renderLog(); renderSettings(); updateHeader();
}
function renderPlanViews(){ renderDash(); renderSchema(); }
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

document.querySelectorAll('nav.bottom button').forEach(b=> b.onclick=()=>setView(b.dataset.view));
document.getElementById('fab').onclick=()=>{
  const today=todayISO(), w=planWeek(today), plan=buildWeek(w);
  const di=(new Date().getDay()+6)%7;
  const blocks=plan.days[di].blocks;
  const idx=blocks.findIndex((b,bi)=>!DB.sessions.some(s=>s.planKey===today+'#'+bi));
  if(idx>=0 && !plan.days[di].rest) openSession(prefillFromPlan(today,idx));
  else openSession(null);
};
document.getElementById('modal').querySelector('.backdrop').onclick=closeSheet;
save();
render();
</script>
