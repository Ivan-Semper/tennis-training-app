<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1512" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Training — Ivan</title>
<style>
:root{
  --bg:#0e1512;
  --bg2:#14201b;
  --card:#182924;
  --card2:#1e332c;
  --line:#26433a;
  --ink:#eaf5ef;
  --muted:#8fa89d;
  --accent:#38e08b;
  --tennis:#38e08b;
  --kracht:#f5b74a;
  --cardio:#4aa8f5;
  --danger:#ff6b6b;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;color-scheme:dark}
input[type=range]{accent-color:var(--accent);height:28px}
input[type=date],input[type=number],input[type=time]{color-scheme:dark}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--accent)}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#12201a 0%, rgba(14,21,18,.96) 100%);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:18px;margin:0;letter-spacing:.3px}
.top .sub{font-size:12px;color:var(--muted);margin-top:3px}
.pill{
  background:var(--card2);border:1px solid var(--line);color:var(--accent);
  border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap
}

main{padding:16px 14px 24px;max-width:720px;margin:0 auto}
.view{display:none}
.view.active{display:block}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px}
.card h3{font-size:15px;margin:0 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(150deg,#1c3a2b 0%, #16261f 60%);
  border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;
}
.hero .phase{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero .wk{font-size:26px;font-weight:700;margin:4px 0 2px}
.hero .theme{font-size:13px;color:var(--muted)}
.ringwrap{display:flex;align-items:center;gap:18px;margin-top:14px}
.ring{position:relative;width:96px;height:96px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:22px;line-height:1}
.ring .val span{font-size:10px;color:var(--muted);letter-spacing:.5px}
.heromini{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:rgba(0,0,0,.22);border-radius:12px;padding:9px 10px}
.mini .n{font-size:17px;font-weight:700}
.mini .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

/* ---------- stat grid ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat .n{font-size:19px;font-weight:700}
.stat .n small{font-size:11px;font-weight:600;color:var(--muted)}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}

/* ---------- chart ---------- */
.chart{width:100%;height:150px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ---------- bars ---------- */
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* ---------- tags ---------- */
.tag{font-size:10px;padding:3px 8px;border-radius:999px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.t-tennis{background:rgba(56,224,139,.15);color:var(--tennis)}
.t-kracht{background:rgba(245,183,74,.15);color:var(--kracht)}
.t-cardio{background:rgba(74,168,245,.15);color:var(--cardio)}
.t-plan{background:rgba(255,255,255,.08);color:var(--muted)}

/* ---------- sessie-items ---------- */
.sess{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:var(--card)}
.sess.planned{border-style:dashed;opacity:.9}
.sess .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.sess .body{flex:1;min-width:0}
.sess .ttl{font-size:14px;font-weight:600}
.sess .sub{font-size:12px;color:var(--muted);margin-top:2px}
.sess .note{font-size:12.5px;color:#cfe0d7;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.rpe{font-size:11px;font-weight:700;padding:3px 7px;border-radius:8px;background:rgba(255,255,255,.07);color:var(--muted)}

/* ---------- trainingskaarten ---------- */
.tpl{display:flex;gap:11px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:14px;margin-bottom:9px;background:var(--card);cursor:pointer}
.tpl .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.tpl .body{flex:1;min-width:0}
.tpl .ttl{font-size:15px;font-weight:700}
.tpl .sub{font-size:12px;color:var(--muted);margin-top:3px}
.tpl .det{font-size:11.5px;color:#cfe0d7;margin-top:6px;line-height:1.5}
.tpl .go{color:var(--muted);font-size:16px;align-self:center}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--accent);color:#082114;border:none;border-radius:12px;
  padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;
}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;border:1px solid rgba(255,107,107,.5);color:var(--danger)}
.btn.block{width:100%}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

.fab{
  position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:45;
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#082114;
  border:none;font-size:28px;font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.45);cursor:pointer
}

/* ---------- nav ---------- */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(18,32,26,.97);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  backdrop-filter:blur(10px);
}
nav.bottom button{
  background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;cursor:pointer
}
nav.bottom button .i{font-size:19px;line-height:1}
nav.bottom button.active{color:var(--accent)}

/* ---------- forms ---------- */
label.f{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;color:var(--ink);outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical;line-height:1.5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  flex:1 1 auto;min-width:64px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);
  border-radius:11px;padding:10px 8px;font-size:12.5px;font-weight:600;cursor:pointer
}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#082114}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.modal .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:var(--bg2);border-top-left-radius:22px;border-top-right-radius:22px;
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
}
.grab{width:40px;height:4px;border-radius:99px;background:#3a5a4d;margin:8px auto 4px}
.sheet h2{font-size:17px;margin:6px 0 2px}

/* ---------- oefening- en focusrijen ---------- */
.exrow{display:grid;grid-template-columns:1fr 46px 46px 56px 30px;gap:6px;margin-bottom:7px;align-items:center}
.exrow input{padding:9px 8px;font-size:14px;border-radius:9px}
.exrow .del{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:0}
.exhead{display:grid;grid-template-columns:1fr 46px 46px 56px 30px;gap:6px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.exrow.noweight{grid-template-columns:1fr 46px 46px 30px}
.exhead.noweight{grid-template-columns:1fr 46px 46px 30px}

.focusrow{display:grid;grid-template-columns:30px 1fr 30px;gap:6px;margin-bottom:7px;align-items:center}
.focusrow input[type=text]{padding:9px 10px;font-size:14px;border-radius:9px}
.focusrow .del{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:0}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 10px;line-height:1.6}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg2);display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;cursor:pointer;flex:0 0 auto}
.check.on{background:var(--accent);border-color:var(--accent);color:#082114}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--accent);color:#082114;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.show{opacity:1}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div>
      <h1 id="topTitle">Dashboard</h1>
      <div class="sub" id="topSub">—</div>
    </div>
    <div class="pill" id="topPill">—</div>
  </div>
</header>

<main>
  <section id="view-dash" class="view active"></section>
  <section id="view-trainingen" class="view"></section>
  <section id="view-log" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>

<button class="fab" id="fab" aria-label="Training loggen">+</button>

<nav class="bottom">
  <button data-view="dash" class="active"><span class="i">📊</span>Dashboard</button>
  <button data-view="trainingen"><span class="i">📋</span>Trainingen</button>
  <button data-view="log"><span class="i">📝</span>Logboek</button>
  <button data-view="settings"><span class="i">⚙️</span>Instellingen</button>
</nav>

<div class="modal" id="modal">
  <div class="backdrop" data-close></div>
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   TRAINING APP — single file, data in localStorage
   Eigen trainingen aanmaken, opslaan en loggen.
   ============================================================ */

/* ---------- 1. OPSLAG ---------- */
const KEY = 'ivan-training-app-v2';
const OLD_KEY = 'ivan-tennis-app-v1';
const DEFAULTS = {
  settings:{ weeklyGoal:4, defaultTime:'18:00', calReminder:60 },
  templates: [],
  sessions: []
};
let DB = loadDB();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function loadDB(){
  try{
    localStorage.removeItem(OLD_KEY);
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULTS));
    const d = JSON.parse(raw);
    d.settings  = Object.assign({}, DEFAULTS.settings, d.settings||{});
    d.templates = Array.isArray(d.templates)? d.templates : [];
    d.sessions  = Array.isArray(d.sessions)?  d.sessions  : [];
    return d;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }

/* ---------- 2. DATUM HELPERS ---------- */
const DAYNAMES = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
const MONTHS = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const DAYSHORT = ['Ma','Di','Wo','Do','Vr','Za','Zo'];

function pad(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function mondayOf(d){ const x=new Date(d); const off=(x.getDay()+6)%7; x.setDate(x.getDate()-off); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDate(s){ const d=parseISO(s); return DAYSHORT[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()]; }
function todayISO(){ return iso(new Date()); }

/* ---------- 3. TYPES ---------- */
const TYPES = {
  kracht: {label:'Kracht', icon:'🏋️', hex:'#f5b74a'},
  cardio: {label:'Cardio', icon:'🏃', hex:'#4aa8f5'},
  tennis: {label:'Tennis', icon:'🎾', hex:'#38e08b'}
};
const TYPE_KEYS = ['kracht','cardio','tennis'];
const CARDIO_KINDS = ['Hardlopen','Fietsen','Roeien','Zwemmen','Crosstrainer','Wandelen','Anders'];
const FEELS = ['😖','😕','😐','🙂','🤩'];

function typeOf(t){ return TYPES[t] || TYPES.tennis; }

/* ---------- 4. BEREKENINGEN ---------- */
function doneSessions(){ return DB.sessions.filter(s=>s.done); }
function sessionsSorted(list){
  return (list||DB.sessions).slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.created||0)-(a.created||0));
}
function sessionsInWeek(monday){
  const s=iso(monday), e=iso(addDays(monday,6));
  return doneSessions().filter(x=>x.date>=s&&x.date<=e);
}
function sumMin(list){ return list.reduce((t,x)=>t+(+x.minutes||0),0); }
function sumKm(list){ return list.reduce((t,x)=>t+(+x.km||0),0); }
function avg(list, f){ const v=list.map(f).filter(x=>x>0); return v.length? v.reduce((a,b)=>a+b,0)/v.length : 0; }
function trainingDays(list){ return new Set(list.map(x=>x.date)).size; }
function fmtMin(m){ m=Math.round(m); if(m<60) return m+' min'; const h=Math.floor(m/60), r=m%60; return h+'u'+(r?' '+r:''); }
function fmtHours(m){ return (m/60).toFixed(1).replace('.',',')+'u'; }
function pace(km,min){ if(!km||!min) return null; const p=min/km; const mm=Math.floor(p), ss=Math.round((p-mm)*60); return mm+':'+pad(ss===60?0:ss)+' /km'; }
function tonnage(s){ if(!s.ex) return 0; return s.ex.reduce((t,e)=> t + (+e.sets||0)*(+e.reps||0)*(+e.kg||0), 0); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function dayStreak(){
  let streak=0; let d=new Date(); d.setHours(0,0,0,0);
  const set = new Set(doneSessions().map(s=>s.date));
  if(!set.has(iso(d))) d = addDays(d,-1);
  while(set.has(iso(d))){ streak++; d=addDays(d,-1); }
  return streak;
}
function weekStreak(){
  const goal = +DB.settings.weeklyGoal||4;
  let streak=0; let m = mondayOf(new Date());
  for(let i=0;i<200;i++){
    const days = trainingDays(sessionsInWeek(m));
    if(i===0 && days===0){ m=addDays(m,-7); continue; }
    if(days>=goal){ streak++; m=addDays(m,-7); } else break;
  }
  return streak;
}

/* ---------- 5. TRAININGEN (sjablonen) ---------- */
function templatesOfType(t){ return DB.templates.filter(x=>x.type===t); }
function templateById(id){ return DB.templates.find(t=>t.id===id)||null; }

function templateSummary(t){
  if(t.type==='kracht'){
    const n=(t.ex||[]).length;
    return n? n+' oefening'+(n===1?'':'en') : 'nog geen oefeningen';
  }
  if(t.type==='cardio'){
    const parts=[t.cardioKind||'Cardio'];
    if(+t.km) parts.push((+t.km).toFixed(1).replace('.',',')+' km');
    if(+t.minutes) parts.push(t.minutes+' min');
    return parts.join(' · ');
  }
  const n=(t.focus||[]).length;
  return (+t.minutes? t.minutes+' min' : 'tennis') + (n? ' · '+n+' aandachtspunt'+(n===1?'':'en') : '');
}
function templateDetail(t){
  if(t.type==='kracht') return (t.ex||[]).map(e=>e.name+' '+(e.sets||'')+'×'+(e.reps||'')).join(' · ');
  if(t.type==='tennis') return (t.focus||[]).join(' · ');
  return t.notes||'';
}

/* een nieuwe (nog niet opgeslagen) sessie op basis van een sjabloon */
function sessionFromTemplate(t, date){
  return {
    id:null, created:null,
    date: date||todayISO(),
    time: DB.settings.defaultTime||'18:00',
    type: t.type,
    title: t.name,
    templateId: t.id,
    minutes: t.minutes||'',
    km: t.type==='cardio' ? (t.km||'') : '',
    cardioKind: t.type==='cardio' ? (t.cardioKind||CARDIO_KINDS[0]) : '',
    ex: t.type==='kracht' ? (t.ex||[]).map(e=>({name:e.name,sets:e.sets,reps:e.reps,kg:''})) : [],
    focus: t.type==='tennis' ? (t.focus||[]).map(f=>({t:f,d:false})) : [],
    rpe:6, feel:0, notes:'', done:true
  };
}

/* ---------- 6. DASHBOARD ---------- */
function chartWeeks(n){
  const out=[]; const m = mondayOf(new Date());
  for(let i=n-1;i>=0;i--){
    const mm = addDays(m,-7*i);
    const list = sessionsInWeek(mm);
    const per={}; TYPE_KEYS.forEach(t=> per[t]=sumMin(list.filter(s=>s.type===t)));
    out.push({monday:mm, per:per, total:sumMin(list)});
  }
  return out;
}
function svgChart(data){
  const W=340,H=150,padX=18,bw=(W-padX*2)/data.length;
  const max=Math.max(60,...data.map(d=>d.total));
  let bars='',labels='',grid='';
  [0.5,1].forEach(f=>{
    const y=H-24-(H-44)*f;
    grid+='<line x1="'+padX+'" x2="'+(W-padX)+'" y1="'+y+'" y2="'+y+'" stroke="rgba(255,255,255,.07)" stroke-width="1"/>';
  });
  data.forEach((d,i)=>{
    const x=padX+i*bw+bw*0.18, bwid=bw*0.64;
    let y=H-24;
    TYPE_KEYS.forEach(t=>{
      const mins=d.per[t]; if(!mins) return;
      const h=(H-44)*(mins/max);
      y-=h;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bwid.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+TYPES[t].hex+'" rx="2"/>';
    });
    if(d.total===0){
      bars+='<rect x="'+x.toFixed(1)+'" y="'+(H-27)+'" width="'+bwid.toFixed(1)+'" height="3" fill="rgba(255,255,255,.12)" rx="1.5"/>';
    }
    const lbl = d.monday.getDate()+'/'+(d.monday.getMonth()+1);
    labels+='<text x="'+(padX+i*bw+bw/2).toFixed(1)+'" y="'+(H-8)+'" fill="#8fa89d" font-size="9" text-anchor="middle">'+lbl+'</text>';
    if(d.total) labels+='<text x="'+(padX+i*bw+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" fill="#8fa89d" font-size="8.5" text-anchor="middle">'+Math.round(d.total/60*10)/10+'u</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+grid+bars+labels+'</svg>';
}
function ring(pct,center,sub){
  const r=42,c=2*Math.PI*r,off=c*(1-Math.min(1,pct||0));
  return '<div class="ring"><svg width="96" height="96">'+
    '<circle cx="48" cy="48" r="'+r+'" stroke="rgba(255,255,255,.09)" stroke-width="9" fill="none"/>'+
    '<circle cx="48" cy="48" r="'+r+'" stroke="#38e08b" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
    '</svg><div class="val"><b>'+center+'</b><span>'+sub+'</span></div></div>';
}

function renderDash(){
  const today = todayISO();
  const monday = mondayOf(new Date());
  const week = sessionsInWeek(monday);
  const prevWeek = sessionsInWeek(addDays(monday,-7));
  const goal = +DB.settings.weeklyGoal||4;
  const done = trainingDays(week);
  const min = sumMin(week), km = sumKm(week.filter(s=>s.type==='cardio'));
  const rpe = avg(week, s=>+s.rpe||0), feel = avg(week, s=>+s.feel||0);
  const tonn = week.reduce((t,s)=>t+tonnage(s),0);
  const tennisMin = sumMin(week.filter(s=>s.type==='tennis'));
  const all = doneSessions();
  const allMin = sumMin(all), allKm = sumKm(all.filter(s=>s.type==='cardio'));

  const planned = DB.sessions.filter(s=>!s.done && s.date>=today)
    .sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:String(a.time||'').localeCompare(String(b.time||'')));
  const todayDone = all.filter(s=>s.date===today);

  const last4 = all.filter(s=> s.date >= iso(addDays(monday,-21)) );
  const per4 = {}; let tot4=0;
  TYPE_KEYS.forEach(t=>{ per4[t]=sumMin(last4.filter(s=>s.type===t)); tot4+=per4[t]; });

  const cardio = all.filter(s=>s.type==='cardio' && +s.km>0);
  const longest = cardio.reduce((a,b)=> (+b.km>(a?+a.km:0)?b:a), null);
  const fastest = cardio.filter(s=>+s.km>=2 && +s.minutes>0).reduce((a,b)=> (!a || (b.minutes/b.km)<(a.minutes/a.km))?b:a, null);
  const bestWeek = chartWeeks(26).reduce((a,b)=> b.total>(a?a.total:0)?b:a, null);
  const recent = sessionsSorted(all).slice(0,6);
  const dIdx = (new Date().getDay()+6)%7;

  document.getElementById('view-dash').innerHTML =
  '<div class="hero">'+
    '<div class="phase">'+DAYNAMES[dIdx]+'</div>'+
    '<div class="wk">'+(done>=goal?'Weekdoel gehaald 💪':'Deze week')+'</div>'+
    '<div class="theme">'+(done?done+' trainingsdag'+(done===1?'':'en')+' · '+week.length+' sessies':'Nog niets gelogd deze week')+'</div>'+
    '<div class="ringwrap">'+
      ring(done/goal, done+'/'+goal, 'DAGEN')+
      '<div class="heromini">'+
        '<div class="mini"><div class="n">'+fmtHours(min)+'</div><div class="l">deze week</div></div>'+
        '<div class="mini"><div class="n">'+km.toFixed(1).replace('.',',')+' km</div><div class="l">cardio</div></div>'+
        '<div class="mini"><div class="n">'+(rpe?rpe.toFixed(1).replace('.',','):'–')+'</div><div class="l">gem. RPE</div></div>'+
        '<div class="mini"><div class="n">'+(feel?FEELS[Math.round(feel)-1]:'–')+'</div><div class="l">gevoel</div></div>'+
      '</div>'+
    '</div>'+
  '</div>'+

  '<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Gepland</h2>'+
    '<button class="btn ghost small" id="goTpl">Trainingen →</button></div>'+
    (planned.length? planned.slice(0,6).map(sessHTML).join('')
      : '<div class="empty">Niets gepland.<br>Kies een training in <b>Trainingen</b> en zet hem op een datum.</div>')+
  '</div>'+

  '<div class="card"><h2>Vandaag gelogd</h2>'+
    (todayDone.length? todayDone.map(sessHTML).join('') : '<div class="empty">Nog niets gelogd vandaag. Tik op <b>+</b>.</div>')+
  '</div>'+

  '<div class="card"><h2>Deze week in cijfers</h2>'+
    '<div class="grid3">'+
      '<div class="stat"><div class="n">'+week.length+'</div><div class="l">sessies</div></div>'+
      '<div class="stat"><div class="n">'+fmtHours(tennisMin)+'</div><div class="l">tennis</div></div>'+
      '<div class="stat"><div class="n">'+(tonn?Math.round(tonn/1000)+'<small> ton</small>':'–')+'</div><div class="l">kracht volume</div></div>'+
    '</div>'+
    '<hr class="sep">'+
    '<div class="small muted">Vorige week: '+fmtHours(sumMin(prevWeek))+' · '+trainingDays(prevWeek)+' dagen · '+sumKm(prevWeek.filter(s=>s.type==='cardio')).toFixed(1).replace('.',',')+' km</div>'+
    '<div class="bar"><i style="width:'+Math.min(100, sumMin(prevWeek)? (min/sumMin(prevWeek))*100 : (min?100:0))+'%"></i></div>'+
    '<div class="tiny muted" style="margin-top:6px">'+(sumMin(prevWeek)? (min>=sumMin(prevWeek)?'+':'')+Math.round((min/sumMin(prevWeek)-1)*100)+'% t.o.v. vorige week' : 'Nog geen vergelijking')+'</div>'+
  '</div>'+

  '<div class="card"><h2>Laatste 8 weken</h2>'+
    svgChart(chartWeeks(8))+
    '<div class="legend">'+TYPE_KEYS.map(t=>'<span><i class="dot" style="background:'+TYPES[t].hex+'"></i>'+TYPES[t].label+'</span>').join('')+'</div>'+
  '</div>'+

  '<div class="card"><h2>Verdeling laatste 4 weken</h2>'+
    (tot4? TYPE_KEYS.filter(t=>per4[t]>0).map(t=>
      '<div style="margin-bottom:11px"><div class="row"><span class="small">'+TYPES[t].icon+' '+TYPES[t].label+'</span><span class="small muted">'+fmtHours(per4[t])+' · '+Math.round(per4[t]/tot4*100)+'%</span></div>'+
      '<div class="bar"><i style="width:'+(per4[t]/tot4*100)+'%;background:'+TYPES[t].hex+'"></i></div></div>').join('')
      : '<div class="empty">Nog geen sessies gelogd.</div>')+
  '</div>'+

  '<div class="card"><h2>Consistentie & records</h2>'+
    '<div class="grid2">'+
      '<div class="stat"><div class="n">'+weekStreak()+'<small> wk</small></div><div class="l">weken op rij ≥'+goal+' dagen</div></div>'+
      '<div class="stat"><div class="n">'+dayStreak()+'<small> d</small></div><div class="l">dagen op rij</div></div>'+
      '<div class="stat"><div class="n">'+all.length+'</div><div class="l">sessies totaal</div></div>'+
      '<div class="stat"><div class="n">'+fmtHours(allMin)+'</div><div class="l">uren totaal</div></div>'+
      '<div class="stat"><div class="n">'+allKm.toFixed(1).replace('.',',')+'<small> km</small></div><div class="l">cardio afstand</div></div>'+
      '<div class="stat"><div class="n">'+(bestWeek&&bestWeek.total?fmtHours(bestWeek.total):'–')+'</div><div class="l">beste week</div></div>'+
    '</div>'+
    '<hr class="sep">'+
    '<div class="small muted">🏃 Langste: '+(longest? (+longest.km).toFixed(1).replace('.',',')+' km ('+fmtDate(longest.date)+')':'nog geen')+'</div>'+
    '<div class="small muted" style="margin-top:5px">⚡ Snelste tempo (≥2 km): '+(fastest? pace(+fastest.km,+fastest.minutes)+' ('+fmtDate(fastest.date)+')':'nog geen')+'</div>'+
  '</div>'+

  '<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">Recent</h2><button class="btn ghost small" id="goLog">Alles →</button></div>'+
    (recent.length? recent.map(sessHTML).join('') : '<div class="empty">Nog niets gelogd. Tik op <b>+</b> om je eerste sessie toe te voegen.</div>')+
  '</div>';

  const gt=document.getElementById('goTpl'); if(gt) gt.onclick=()=>setView('trainingen');
  const gl=document.getElementById('goLog'); if(gl) gl.onclick=()=>setView('log');
  bindSessionClicks('#view-dash');
}

function sessHTML(s){
  const t = typeOf(s.type);
  let sub = fmtDate(s.date);
  if(!s.done && s.time) sub += ' · '+s.time;
  if(s.minutes) sub += ' · '+fmtMin(s.minutes);
  if(s.type==='cardio'){
    if(s.cardioKind) sub += ' · '+s.cardioKind;
    if(+s.km) sub += ' · '+(+s.km).toFixed(1).replace('.',',')+' km'+(pace(+s.km,+s.minutes)?' · '+pace(+s.km,+s.minutes):'');
  }
  if(s.type==='kracht' && s.ex && s.ex.length) sub += ' · '+s.ex.length+' oef.';
  const focusDone = (s.focus||[]).filter(f=>f.d);
  return '<div class="sess'+(s.done?'':' planned')+'" data-id="'+s.id+'">'+
    '<div class="ic" style="background:'+t.hex+'22;color:'+t.hex+'">'+t.icon+'</div>'+
    '<div class="body"><div class="ttl">'+esc(s.title||t.label)+(s.done?'':' <span class="tag t-plan">gepland</span>')+'</div>'+
    '<div class="sub">'+sub+'</div>'+
    (s.notes? '<div class="note">'+esc(s.notes)+'</div>':'')+
    (s.type==='kracht'&&s.ex&&s.ex.length? '<div class="note muted tiny">'+s.ex.map(e=>esc(e.name)+' '+(e.sets||'')+'×'+(e.reps||'')+(e.kg?' @ '+e.kg+'kg':'')).join(' · ')+'</div>':'')+
    (focusDone.length? '<div class="note muted tiny">✓ '+focusDone.map(f=>esc(f.t)).join(' · ')+'</div>':'')+
    '</div>'+
    '<div style="text-align:right">'+(s.rpe&&s.done?'<div class="rpe">RPE '+s.rpe+'</div>':'')+(s.feel?'<div style="margin-top:5px;font-size:15px">'+FEELS[s.feel-1]+'</div>':'')+'</div>'+
  '</div>';
}
function bindSessionClicks(scope){
  document.querySelectorAll(scope+' .sess[data-id]').forEach(el=>{
    el.onclick = ()=>{ const s=DB.sessions.find(x=>x.id===el.dataset.id); if(s) openSession(s); };
  });
}

    '<div class="inline">'+

      '<button class="btn block" id="tplLog">✓ Nu loggen</button>'+

    '</div>'+
    '<hr class="sep">'+
    '<div class="btnrow">'+
      '<button class="btn ghost small" id="tplEdit">✏️ Bewerken</button>'+
      '<button class="btn ghost small" id="tplCopy">⧉ Dupliceren</button>'+
      '<button class="btn danger small" id="tplDel">Verwijderen</button>'+
    '</div>'
  );

  const tEl=()=>document.getElementById('tplTime').value||DB.settings.defaultTime;
  document.getElementById('tplLog').onclick=()=>{
    const s=sessionFromTemplate(t, dEl()); s.time=tEl(); s.done=true; openSession(s);
  };
  document.getElementById('tplPlan').onclick=()=>{
    const s=sessionFromTemplate(t, dEl()); s.time=tEl(); s.done=false; openSession(s);
  };
  document.getElementById('tplEdit').onclick=()=>openTemplate(t);
  document.getElementById('tplCopy').onclick=()=>{
    const c=JSON.parse(JSON.stringify(t)); c.id=null; c.name=t.name+' (kopie)';
    openTemplate(c);
  };
  document.getElementById('tplDel').onclick=()=>{
    if(confirm('Training "'+t.name+'" verwijderen? Je gelogde sessies blijven staan.')){
      DB.templates = DB.templates.filter(x=>x.id!==t.id);
      save(); closeSheet(); render(); toast('Training verwijderd');
    }
  };
}

/* ---------- 8. TRAININGSFORMULIER (sjabloon) ---------- */
let tform = null;
function openTemplate(t, type){
  tform = Object.assign(
    {id:null, type:type||'kracht', name:'', minutes:'', notes:'', ex:[], focus:[], cardioKind:CARDIO_KINDS[0], km:''},
    t? JSON.parse(JSON.stringify(t)) : {}
  );
  if(!tform.ex) tform.ex=[];
  if(!tform.focus) tform.focus=[];
  if(tform.type==='kracht' && !tform.ex.length) tform.ex=[{name:'',sets:'3',reps:'10',kg:''}];
  if(tform.type==='tennis' && !tform.focus.length) tform.focus=[''];
  renderTemplateSheet();
}
function collectTemplate(){
  const g=id=>document.getElementById(id);
  if(!g('tName')) return;
  tform.name = g('tName').value;
  tform.minutes = g('tMin').value;
  tform.notes = g('tNotes').value;
  if(g('tKind')) tform.cardioKind = g('tKind').value;
  if(g('tKm')) tform.km = g('tKm').value;
  const rows = document.querySelectorAll('#tExList .exrow');
  if(rows.length) tform.ex = Array.from(rows).map(r=>({
    name:r.querySelector('.exn').value, sets:r.querySelector('.exs').value, reps:r.querySelector('.exr').value, kg:''
  }));
  const frows = document.querySelectorAll('#tFocusList .focusrow');
  if(frows.length) tform.focus = Array.from(frows).map(r=>r.querySelector('.fxt').value);
}
function renderTemplateSheet(){
  const f=tform;
  sheetHTML(
    '<div class="row"><h2>'+(f.id?'Training bewerken':'Nieuwe training')+'</h2>'+
      '<button class="btn ghost small" data-close>Sluiten</button></div>'+

    '<label class="f">Soort</label>'+
    '<div class="seg" id="tTypeSeg">'+TYPE_KEYS.map(t=>'<button data-ttype="'+t+'" class="'+(f.type===t?'on':'')+'">'+TYPES[t].icon+' '+TYPES[t].label+'</button>').join('')+'</div>'+

    '<label class="f">Naam van de training</label>'+
    '<input type="text" id="tName" value="'+esc(f.name)+'" placeholder="'+(f.type==='kracht'?'Bijv. Kracht — benen &amp; push':f.type==='cardio'?'Bijv. Duurloop rustig':'Bijv. Tennis — techniek')+'">'+

    (f.type==='cardio'
      ? '<div class="inline"><div><label class="f">Soort cardio</label><select id="tKind">'+
          CARDIO_KINDS.map(k=>'<option'+(f.cardioKind===k?' selected':'')+'>'+k+'</option>').join('')+
        '</select></div>'+
        '<div><label class="f">Standaard afstand (km)</label><input type="number" step="0.1" inputmode="decimal" id="tKm" value="'+esc(f.km)+'" placeholder="8.0"></div></div>'
      : '')+

    '<label class="f">Standaardduur (min)</label>'+
    '<input type="number" inputmode="numeric" id="tMin" value="'+esc(f.minutes)+'" placeholder="60">'+

    (f.type==='kracht'
      ? '<label class="f">Oefeningen</label>'+
        '<div class="exhead noweight"><span>Oefening</span><span>Set</span><span>Rep</span><span></span></div>'+
        '<div id="tExList">'+ f.ex.map(tplExRow).join('') +'</div>'+
        '<div class="btnrow" style="margin-top:8px"><button class="btn ghost small" id="tAddEx">+ Oefening</button></div>'
      : '')+

    (f.type==='tennis'
      ? '<label class="f">Aandachtspunten / onderdelen</label>'+
        '<div id="tFocusList">'+ f.focus.map(focusTplRow).join('') +'</div>'+
        '<div class="btnrow" style="margin-top:8px"><button class="btn ghost small" id="tAddFocus">+ Punt</button></div>'+
        '<div class="tiny muted" style="margin-top:6px">Deze punten kun je tijdens het loggen afvinken.</div>'
      : '')+

    '<label class="f">Notities (optioneel)</label>'+
    '<textarea id="tNotes" placeholder="Vaste opmerkingen, warming-up, rusttijden…">'+esc(f.notes)+'</textarea>'+

    '<div style="margin-top:18px">'+
      '<button class="btn block" id="tSave">Training opslaan</button>'+
    '</div>'
  );

  document.querySelectorAll('#tTypeSeg [data-ttype]').forEach(b=>{
    b.onclick=()=>{
      collectTemplate();
      tform.type=b.dataset.ttype;
      if(tform.type==='kracht' && !tform.ex.length) tform.ex=[{name:'',sets:'3',reps:'10',kg:''}];
      if(tform.type==='tennis' && !tform.focus.length) tform.focus=[''];
      renderTemplateSheet();
    };
  });
  const ae=document.getElementById('tAddEx');
  if(ae) ae.onclick=()=>{ collectTemplate(); tform.ex.push({name:'',sets:'3',reps:'10',kg:''}); renderTemplateSheet(); };
  const af=document.getElementById('tAddFocus');
  if(af) af.onclick=()=>{ collectTemplate(); tform.focus.push(''); renderTemplateSheet(); };
  document.querySelectorAll('#tExList .del').forEach((b,i)=>{
    b.onclick=()=>{ collectTemplate(); tform.ex.splice(i,1); renderTemplateSheet(); };
  });
  document.querySelectorAll('#tFocusList .del').forEach((b,i)=>{
    b.onclick=()=>{ collectTemplate(); tform.focus.splice(i,1); renderTemplateSheet(); };
  });
  document.getElementById('tSave').onclick=saveTemplate;
}
function tplExRow(e){
  return '<div class="exrow noweight">'+
    '<input class="exn" type="text" value="'+esc(e.name)+'" placeholder="Oefening">'+
    '<input class="exs" type="text" inputmode="numeric" value="'+esc(e.sets)+'" placeholder="3">'+
    '<input class="exr" type="text" value="'+esc(e.reps)+'" placeholder="10">'+
    '<button class="del">×</button></div>';
}
function focusTplRow(txt){
  return '<div class="focusrow" style="grid-template-columns:1fr 30px">'+
    '<input class="fxt" type="text" value="'+esc(txt)+'" placeholder="Bijv. forehand cross diep">'+
    '<button class="del">×</button></div>';
}
function saveTemplate(){
  collectTemplate();
  const name=(tform.name||'').trim();
  if(!name){ toast('Geef de training een naam'); return; }
  const t = {
    id: tform.id || uid(),
    created: tform.created || Date.now(),
    type: tform.type,
    name: name,
    minutes: +tform.minutes||0,
    notes: (tform.notes||'').trim(),
    cardioKind: tform.type==='cardio' ? (tform.cardioKind||CARDIO_KINDS[0]) : '',
    km: tform.type==='cardio' ? (+tform.km||0) : 0,
    ex: tform.type==='kracht' ? (tform.ex||[]).filter(e=>e.name && e.name.trim()).map(e=>({name:e.name.trim(),sets:e.sets,reps:e.reps})) : [],
    focus: tform.type==='tennis' ? (tform.focus||[]).map(x=>String(x).trim()).filter(Boolean) : []
  };
  const i = DB.templates.findIndex(x=>x.id===t.id);
  if(i>=0) DB.templates[i]=t; else DB.templates.push(t);
  save(); closeSheet(); render(); setView('trainingen'); toast(i>=0?'Bijgewerkt ✓':'Training opgeslagen ✓');
}

/* ---------- 9. SESSIE-FORMULIER ---------- */
let form = null;
function openSession(s){
  form = Object.assign({

/* ---------- 11. AGENDA / ICS ---------- */
function icsEsc(s){
  return String(s==null?'':s)
    .replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,')
    .replace(/\r?\n/g,'\\n');
}
function fold(line){
  let out='', chunk='', cur=0;
  for(const ch of line){
    const len = new TextEncoder().encode(ch).length;
    if(cur+len > 73){ out += chunk + '\r\n '; chunk=''; cur=1; }
    chunk += ch; cur += len;
  }
  return out + chunk;
}
function utcStamp(d){
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
}
function localStamp(dateStr, mins){
  const d = parseISO(dateStr);
  d.setMinutes(d.getMinutes()+mins);
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
}
const VTIMEZONE = [
'BEGIN:VTIMEZONE','TZID:Europe/Amsterdam','X-LIC-LOCATION:Europe/Amsterdam',
'BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST',
'DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT',
'BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET',
'DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD',
'END:VTIMEZONE'];

function sessionDescription(s){
  const parts=[];
  if(s.type==='kracht' && s.ex && s.ex.length)
    parts.push(s.ex.map(e=>'• '+e.name+' — '+(e.sets||'')+'×'+(e.reps||'')+(e.kg?' @ '+e.kg+' kg':'')).join('\n'));
  if(s.type==='cardio'){
    const d=[]; if(s.cardioKind) d.push(s.cardioKind);
    if(+s.km) d.push((+s.km).toFixed(1).replace('.',',')+' km');
    if(+s.minutes) d.push(s.minutes+' min');
    if(d.length) parts.push(d.join(' · '));
  }
  if(s.type==='tennis' && s.focus && s.focus.length)
    parts.push(s.focus.map(f=>'• '+f.t).join('\n'));
  if(s.notes) parts.push(s.notes);
  return parts.join('\n\n');
}
function veventFor(s){
  const rem = +DB.settings.calReminder||0;
  const t = String(s.time||DB.settings.defaultTime||'18:00').split(':');
  const start = (+t[0])*60 + (+t[1]||0);
  const dur = +s.minutes||60;
  const lines = [
    'BEGIN:VEVENT',
    'UID:tr-'+s.id+'@ivan-training',
    'DTSTAMP:'+utcStamp(new Date()),
    'SEQUENCE:'+Math.floor((Date.now()-1577836800000)/60000),
    'DTSTART;TZID=Europe/Amsterdam:'+localStamp(s.date, start),
    'DTEND;TZID=Europe/Amsterdam:'+localStamp(s.date, start+dur),
    'SUMMARY:'+icsEsc(typeOf(s.type).icon+' '+(s.title||typeOf(s.type).label)),
    'DESCRIPTION:'+icsEsc(sessionDescription(s)),
    'CATEGORIES:'+icsEsc('Training,'+typeOf(s.type).label),
    'STATUS:CONFIRMED','TRANSP:OPAQUE'
  ];
  if(rem>0){
    lines.push('BEGIN:VALARM','TRIGGER:-PT'+rem+'M','ACTION:DISPLAY',
               'DESCRIPTION:'+icsEsc(s.title||typeOf(s.type).label),'END:VALARM');
  }
  lines.push('END:VEVENT');
  return lines;
}
function buildICS(sessions, name){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ivan Training//NL','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:'+icsEsc(name||'Training'),'X-WR-TIMEZONE:Europe/Amsterdam']
    .concat(VTIMEZONE);
  sessions.forEach(s=> lines.push.apply(lines, veventFor(s)));
  lines.push('END:VCALENDAR');
  return lines.map(fold).join('\r\n')+'\r\n';
}
function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
}
function downloadICS(text, filename){
  const blob = new Blob([text], {type:'text/calendar;charset=utf-8'});
  /* iPhone/iPad: via het deelmenu kun je direct "Agenda" kiezen */
  if(typeof File === 'function' && navigator.canShare){
    const file = new File([blob], filename, {type:'text/calendar'});
    if(navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'Training'}).catch(()=>saveBlob(blob, filename));
      return;
    }
  }
  saveBlob(blob, filename);
}
function exportSessions(list, filename){
  if(!list.length){ toast('Niets te exporteren'); return; }
  downloadICS(buildICS(list, 'Training — Ivan'), filename||'trainingen.ics');
  toast(list.length===1? 'Afspraak klaar — kies Agenda' : list.length+' afspraken geëxporteerd');
}

  document.getElementById('calAll').onclick=()=>exportSessions(planned, 'trainingen.ics');

  document.getElementById('expBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='training-backup-'+todayISO()+'.json';
    a.click(); URL.revokeObjectURL(a.href);
  };
  document.getElementById('impBtn').onclick=()=>document.getElementById('fileIn').click();
  document.getElementById('fileIn').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d || (!Array.isArray(d.sessions) && !Array.isArray(d.templates))) throw new Error('ongeldig');
        DB.sessions = Array.isArray(d.sessions)? d.sessions : DB.sessions;
        DB.templates = Array.isArray(d.templates)? d.templates : DB.templates;
        DB.settings = Object.assign(DB.settings, d.settings||{});
        save(); toast('Import gelukt'); render();
      }catch(err){ alert('Kon dit bestand niet lezen.'); }
    };
    r.readAsText(f);
  };
  document.getElementById('wipeBtn').onclick=()=>{
    if(confirm('Alle trainingen én sessies verwijderen? Dit kan niet ongedaan worden gemaakt.')){
      DB.sessions=[]; DB.templates=[]; save(); toast('Alles gewist'); render();
    }
  };
}

/* ---------- 14. APP ---------- */
function sheetHTML(html){
  const sheet=document.getElementById('sheet');
  sheet.innerHTML = '<div class="grab"></div>'+html;
  sheet.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  sheet.scrollTop=0;
  document.getElementById('modal').classList.add('open');
}
function closeSheet(){ document.getElementById('modal').classList.remove('open'); form=null; tform=null; }

let currentView='dash';
function setView(v){
  currentView=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  updateHeader();
  window.scrollTo(0,0);
}
function updateHeader(){
  const titles={dash:'Dashboard',trainingen:'Trainingen',log:'Logboek',settings:'Instellingen'};
  const d=new Date();
  const week = sessionsInWeek(mondayOf(d));
  const subs={
    dash: DAYNAMES[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()],
    trainingen: DB.templates.length+' trainingen opgeslagen',
    log: doneSessions().length+' sessies gelogd',
    settings: 'Data staat lokaal op dit toestel'
  };
  document.getElementById('topTitle').textContent=titles[currentView];
  document.getElementById('topSub').textContent=subs[currentView];
  document.getElementById('topPill').textContent=trainingDays(week)+'/'+(+DB.settings.weeklyGoal||4)+' deze week';
}
function render(){
  renderDash(); renderTrainingen(); renderLog(); renderSettings(); updateHeader();
}
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

document.querySelectorAll('nav.bottom button').forEach(b=> b.onclick=()=>setView(b.dataset.view));
document.getElementById('fab').onclick=openPicker;
document.getElementById('modal').querySelector('.backdrop').onclick=closeSheet;
save();
render();
</script>
</body>
